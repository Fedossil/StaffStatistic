# ==========================================================
#              Синхронизация с Discord (Webhook)
# ==========================================================
discord:
  # Включить отправку логов в канал Discord
  enabled: false

  # URL вебхука Discord (Создается в настройках канала -> Интеграции -> Вебхуки)
  webhook-url: "https://discord.com/api/webhooks/your_webhook_here"

  # Цвета полосок Embed-сообщений (DECIMAL формат цветов)
  embed:
    color-on-duty: 65280       # Зеленый (выход на смену)
    color-off-duty: 16711680   # Красный (завершение смены)
    color-punish: 16753920     # Оранжевый (выдача наказания)