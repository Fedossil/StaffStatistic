sheets:
  # Включить/выключить отправку данных в Google Таблицу
  enabled: false

  # URL развернутого Google Apps Script Веб-приложения
  webapp-url: "https://script.google.com/macros/s/your_script_id/exec"

  # Отправлять ли данные автоматически при каждом завершении смены (/sw)
  sync-on-duty-end: true